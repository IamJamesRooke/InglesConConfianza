<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="quiero que vengas se dice I want you to come: el que no se traduce">
  <g text-anchor="middle" font-family="Geist, Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="700">
    <text x="180" y="40" font-size="34" fill="#bb061e">quiero <tspan fill="#7d24d3">que</tspan> vengas</text>
    <text x="180" y="166" font-size="34" fill="#123eb2">I want you to come</text>
